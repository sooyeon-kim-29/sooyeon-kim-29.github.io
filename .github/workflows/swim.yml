name: Update swim distance

on:
  repository_dispatch:
    types: [swim]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write swim.json
        env:
          METERS: ${{ github.event.client_payload.meters }}
        run: |
          # accept only a plain number
          if ! [[ "$METERS" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid value: $METERS"; exit 1
          fi
          printf '{"meters": %s, "updated": "%s"}\n' \
            "$METERS" "$(TZ=America/New_York date +%F)" > swim.json

      - name: Commit and push
        run: |
          git config user.name "swim-bot"
          git config user.email "swim-bot@users.noreply.github.com"
          git add swim.json
          git commit -m "Weekly swim update" || echo "No change"
          git push
